<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Control Center Overlay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "glass-specular": "rgba(255, 255, 255, 0.28)",
                        "surface-tint": "#acc7ff",
                        "on-primary-container": "#00295c",
                        "accent-glow": "rgba(74, 144, 255, 0.24)",
                        "on-tertiary-container": "#452200",
                        "on-tertiary-fixed-variant": "#6d3900",
                        "surface": "#131313",
                        "background": "#131313",
                        "surface-container-high": "#2a2a2a",
                        "primary": "#acc7ff",
                        "error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb77b",
                        "secondary-container": "#48494d",
                        "secondary-fixed-dim": "#c6c6cb",
                        "on-secondary-container": "#b8b8bd",
                        "surface-raised": "#242426",
                        "on-tertiary": "#4d2700",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed": "#e3e2e7",
                        "on-surface": "#e5e2e1",
                        "surface-variant": "#353534",
                        "secondary": "#c6c6cb",
                        "tertiary": "#ffb77b",
                        "on-primary": "#002f67",
                        "on-surface-variant": "#c2c6d5",
                        "surface-container-low": "#1c1b1b",
                        "on-primary-fixed-variant": "#004491",
                        "inverse-on-surface": "#313030",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#353534",
                        "on-error-container": "#ffdad6",
                        "surface-base": "#1C1C1E",
                        "on-secondary-fixed": "#1a1b1f",
                        "inverse-surface": "#e5e2e1",
                        "glass-fill": "rgba(36, 36, 38, 0.78)",
                        "on-background": "#e5e2e1",
                        "success": "#30D158",
                        "primary-fixed-dim": "#acc7ff",
                        "danger": "#FF453A",
                        "primary-fixed": "#d7e2ff",
                        "surface-bright": "#393939",
                        "outline": "#8c909f",
                        "surface-container": "#201f1f",
                        "warning": "#FFB340",
                        "surface-dim": "#131313",
                        "on-tertiary-fixed": "#2e1500",
                        "on-primary-fixed": "#001a40",
                        "tertiary-fixed": "#ffdcc2",
                        "on-secondary-fixed-variant": "#46474b",
                        "on-secondary": "#2f3034",
                        "outline-variant": "#414753",
                        "tertiary-container": "#db7900",
                        "inverse-primary": "#005bbe",
                        "primary-container": "#4a90ff",
                        "surface-high": "#2E2E32"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gap-section": "24px",
                        "gutter-bento": "16px",
                        "padding-card": "16px",
                        "touch-target-min": "48px",
                        "unit": "8px",
                        "margin-screen": "20px"
                    },
                    "fontFamily": {
                        "display-xl": ["PlusJakartaSans"],
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "caption": ["Inter"],
                        "title": ["Inter"],
                        "display-lg": ["PlusJakartaSans"],
                        "micro": ["Inter"],
                        "stats-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "display-xl": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "headline": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body": ["15px", { "lineHeight": "22px", "letterSpacing": "0", "fontWeight": "400" }],
                        "caption": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "title": ["18px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "600" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "micro": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "stats-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body h-screen w-screen overflow-hidden relative">
<!-- Ambient Background Wallpaper -->
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="A mesmerizing, high-resolution abstract background depicting a deep cosmic nebula. Flowing waves of iridescent purple, deep blue, and subtle cyan blend together in a liquid-like motion. The lighting is soft and cinematic, creating a premium, calming dark-mode aesthetic suitable for a modern operating system desktop." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC5mXnRUlWh3NFsIKhHtijsX7MnzQ7yZbYnfG11goi6jyh6KDXK-uR0xBRU1dMMyN1_pV_ahHyR71-SDqkS-k3IbS_C9q4QW_jeURg0cyn6DYiYR_kwEl54KMDcKs1cJ-k8Dnkz9wn17pyyJXGhIH-lJuim42XHLBBkKetooWb-ZmhCkJkIvo0ZOovi5ZnWbYeaty803ua1L_Yz1LKiKDEnFLu2ipRrXR5gGhI3KDJ4ct1wCxD0HX6v')"></div>
<!-- Control Center Overlay -->
<div class="absolute top-margin-screen right-margin-screen w-96 bg-glass-fill backdrop-blur-3xl shadow-2xl shadow-black/60 border-t border-glass-specular flex flex-col gap-gutter-bento p-padding-card z-50 transition-transform duration-500 ease-out translate-y-0" style="border-radius: 28px;">
<!-- Top Bento Row: Connectivity & Media -->
<div class="grid grid-cols-2 gap-gutter-bento">
<!-- Connectivity 2x2 Grid -->
<div class="bg-surface-raised rounded-xl p-3 grid grid-cols-2 gap-3 shadow-sm shadow-black/20">
<!-- WiFi (On) -->
<button class="flex flex-col items-center justify-center gap-1 group">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center group-active:scale-95 transition-transform">
<span class="material-symbols-outlined filled">wifi</span>
</div>
<span class="font-micro text-micro text-on-surface">Wi-Fi</span>
</button>
<!-- Bluetooth (On) -->
<button class="flex flex-col items-center justify-center gap-1 group">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center group-active:scale-95 transition-transform">
<span class="material-symbols-outlined filled">bluetooth</span>
</div>
<span class="font-micro text-micro text-on-surface">Bluetooth</span>
</button>
<!-- Airplane (Off) -->
<button class="flex flex-col items-center justify-center gap-1 group">
<div class="w-12 h-12 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">airplanemode_inactive</span>
</div>
<span class="font-micro text-micro text-on-surface-variant">Airplane</span>
</button>
<!-- Dark Mode (On) -->
<button class="flex flex-col items-center justify-center gap-1 group">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center group-active:scale-95 transition-transform">
<span class="material-symbols-outlined filled">dark_mode</span>
</div>
<span class="font-micro text-micro text-on-surface">Dark</span>
</button>
</div>
<!-- Now Playing Media -->
<div class="bg-surface-raised rounded-xl p-3 shadow-sm shadow-black/20 flex flex-col justify-between relative overflow-hidden group">
<!-- Blurred background element for media flavor -->
<div class="absolute -right-4 -top-4 w-24 h-24 bg-primary-container opacity-10 rounded-full blur-xl"></div>
<div class="flex items-center gap-2 relative z-10">
<div class="w-10 h-10 rounded-lg bg-cover bg-center shadow-md" data-alt="A sleek, minimalist album art cover featuring abstract geometric shapes in vibrant neon pink and electric blue on a pure black background. The design is modern, clean, and highly stylized." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBMyTsdZhW6rC_pIKiNrVeBHT6Wuhg_8-3QHCDwZPsqT6aDWcCycK1cIF4RdZt0stZ2MunAMJGAwzbpoy-cDeSjlPr00yyZ5WEMKF3RI8W6L0FhuAYAEC71HpipEs6UJx9UX-SJburFuSwDN1NZY9bKlvC9Jxy3Eu6TDEmiH1FvrgS95pXorihlTvXRbB_tQPW8kSkZVLgrBPvrcWi3GmyLjwyAOLc0g8sI9_rvylsipv-lBsDlBoAv')"></div>
<div class="flex flex-col overflow-hidden">
<span class="font-caption text-caption font-semibold text-on-surface truncate">Midnight City</span>
<span class="font-micro text-micro text-on-surface-variant truncate">M83</span>
</div>
</div>
<div class="flex justify-between items-center px-1 relative z-10 mt-2 text-on-surface">
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined text-[20px]">skip_previous</span></button>
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined filled text-[28px]">play_arrow</span></button>
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined text-[20px]">skip_next</span></button>
</div>
</div>
</div>
<!-- Sliders Row -->
<div class="flex flex-col gap-unit">
<!-- Brightness Slider -->
<div class="bg-surface-raised rounded-xl h-14 relative overflow-hidden flex items-center px-4 shadow-sm shadow-black/20 cursor-pointer">
<!-- Progress Fill -->
<div class="absolute left-0 top-0 bottom-0 w-3/4 bg-primary-container opacity-80"></div>
<!-- Highlight line -->
<div class="absolute left-0 top-0 right-0 h-px bg-glass-specular z-10"></div>
<span class="material-symbols-outlined relative z-20 text-on-surface">light_mode</span>
</div>
<!-- Volume Slider -->
<div class="bg-surface-raised rounded-xl h-14 relative overflow-hidden flex items-center px-4 shadow-sm shadow-black/20 cursor-pointer">
<!-- Progress Fill -->
<div class="absolute left-0 top-0 bottom-0 w-[45%] bg-primary-container opacity-80"></div>
<!-- Highlight line -->
<div class="absolute left-0 top-0 right-0 h-px bg-glass-specular z-10"></div>
<span class="material-symbols-outlined relative z-20 text-on-surface">volume_up</span>
</div>
</div>
<!-- Quick Launch Apps -->
<div class="flex justify-between items-center px-2">
<button class="w-14 h-14 rounded-full bg-surface-raised flex items-center justify-center text-on-surface hover:bg-surface-bright transition-colors shadow-sm shadow-black/20">
<span class="material-symbols-outlined">photo_camera</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-raised flex items-center justify-center text-on-surface hover:bg-surface-bright transition-colors shadow-sm shadow-black/20">
<span class="material-symbols-outlined">flashlight_on</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-raised flex items-center justify-center text-on-surface hover:bg-surface-bright transition-colors shadow-sm shadow-black/20">
<span class="material-symbols-outlined">calculate</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-raised flex items-center justify-center text-on-surface hover:bg-surface-bright transition-colors shadow-sm shadow-black/20">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
</body></html>
